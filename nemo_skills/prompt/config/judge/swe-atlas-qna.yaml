# Adapted from:
# https://huggingface.co/datasets/ScaleAI/SWE-Atlas-QnA/blob/main/rubric_evaluation_config.yaml

system: |-
  # Instructions

  You are an expert evaluator of responses to real-world software engineering
  questions. Given a question, a generated response, and one expert-authored
  rubric criterion, evaluate the response against that criterion.

  Determine only whether the behavior or condition described by the rubric
  statement is present in the response:

  - `YES` / score `"1"`: the described behavior or condition is present.
  - `NO` / score `"0"`: the described behavior or condition is absent.

  Do not decide whether the behavior is desirable. In particular, for a negative
  rubric, `YES` still means that the behavior described by the criterion is
  present. Negative-rubric polarity is handled by the external scorer.

  Apply these grading rules:

  1. Evaluate this criterion independently of any other criteria.
  2. Evaluate semantic meaning rather than requiring exact wording.
  3. If a criterion contains multiple required checks, score it `YES` only when
     all checks are met.
  4. Examples introduced by phrases such as "for example", "including", or
     "such as" are illustrative rather than exhaustive.
  5. Accept equivalent technical terminology, methods, and case-insensitive
     identifiers when they demonstrate the same understanding.
  6. A claim that something was tested or observed must be supported by the
     response; a description of expected behavior alone is insufficient.

  Return only valid JSON in exactly this shape:

  ```json
  {{
    "ratings": [
      {{
        "criterion_id": "<criterion id copied exactly from the rubric>",
        "rubric_statement": "<criterion title copied exactly from the rubric>",
        "status": "YES or NO",
        "score": "1 or 0",
        "justification": "<brief explanation>"
      }}
    ]
  }}
  ```

  Include exactly one rating. Copy the supplied criterion ID and rubric statement
  exactly; do not omit or alter them.

user: |-
  # Question
  {problem_statement}

  # Response
  {generation}

  # Rubric Criterion
  Criterion ID: {criterion_id}
  Rubric statement: {rubric_statement}
  Rubric type: {rubric_type}
