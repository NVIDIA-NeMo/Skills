# =============================================================================
# NeMo-Skills Image Pull Secret Configuration
# =============================================================================
#
# This file shows how to create image pull secrets for private registries.
# NeMo-Skills containers are typically hosted on NVIDIA NGC (nvcr.io).
#
# DO NOT commit this file with real credentials!
#
# =============================================================================

# -----------------------------------------------------------------------------
# Option 1: Create secret via kubectl (RECOMMENDED)
# -----------------------------------------------------------------------------
#
# For NVIDIA NGC (nvcr.io):
#   kubectl create secret docker-registry nvcr-secret \
#     --namespace=nemo-skills \
#     --docker-server=nvcr.io \
#     --docker-username='$oauthtoken' \
#     --docker-password=YOUR_NGC_API_KEY \
#     --docker-email=your-email@example.com
#
# For Docker Hub:
#   kubectl create secret docker-registry dockerhub-secret \
#     --namespace=nemo-skills \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=YOUR_USERNAME \
#     --docker-password=YOUR_PASSWORD \
#     --docker-email=your-email@example.com
#
# For AWS ECR:
#   # Get token (valid for 12 hours)
#   aws ecr get-login-password --region us-east-1 | \
#     kubectl create secret docker-registry ecr-secret \
#       --namespace=nemo-skills \
#       --docker-server=YOUR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com \
#       --docker-username=AWS \
#       --docker-password-stdin
#
# For Google Artifact Registry:
#   kubectl create secret docker-registry gar-secret \
#     --namespace=nemo-skills \
#     --docker-server=us-docker.pkg.dev \
#     --docker-username=_json_key \
#     --docker-password="$(cat service-account-key.json)"

# -----------------------------------------------------------------------------
# Option 2: Create secret from YAML (for automation)
# -----------------------------------------------------------------------------
#
# First, create the .dockerconfigjson content:
#   # For NGC
#   AUTH=$(echo -n '$oauthtoken:YOUR_NGC_API_KEY' | base64)
#   CONFIG='{"auths":{"nvcr.io":{"auth":"'$AUTH'"}}}'
#   echo -n $CONFIG | base64
#
# Then use the output below:

---
apiVersion: v1
kind: Secret
metadata:
  name: nvcr-secret
  namespace: nemo-skills
  labels:
    app.kubernetes.io/name: nemo-skills
    app.kubernetes.io/component: image-pull-secret
type: kubernetes.io/dockerconfigjson
data:
  # REPLACE THIS with your base64-encoded docker config
  # Generate with: echo -n '{"auths":{"nvcr.io":{"auth":"BASE64_OF_$oauthtoken:NGC_API_KEY"}}}' | base64
  .dockerconfigjson: "REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG"

# -----------------------------------------------------------------------------
# Verify secret was created correctly
# -----------------------------------------------------------------------------
#
# kubectl get secret nvcr-secret -n nemo-skills -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d
#
# Test pulling an image:
# kubectl run test-pull --image=nvcr.io/nvidia/pytorch:24.01-py3 \
#   --overrides='{"spec":{"imagePullSecrets":[{"name":"nvcr-secret"}]}}' \
#   --restart=Never -n nemo-skills --rm -it -- echo "Pull successful"
