name: CPU tests

on:
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Free up disk space
      run: |
        # Remove unnecessary files on macOS
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf /usr/local/lib/node_modules || true
        brew cleanup || true
        # Clear pip cache
        pip cache purge || true
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev] --extra-index-url https://download.pytorch.org/whl/cpu
        # Clear pip cache
        pip cache purge || true
    - name: Build Images
      run: |
        # these tags need to match the ones in tests/gpu-tests/test-local.yaml
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        docker buildx build \
          --tag nemo-skills-image \
          --file dockerfiles/Dockerfile.nemo-skills \
          --cache-from type=registry,ref=ghcr.io/${REPO_LOWER}/nemo-skills-image:cache \
          --cache-to type=registry,ref=ghcr.io/${REPO_LOWER}/nemo-skills-image:cache,mode=max \
          --load \
          .
        docker buildx build \
          --tag nemo-skills-sandbox-image \
          --file dockerfiles/Dockerfile.sandbox \
          --build-arg GITHUB_CI=1 \
          --cache-from type=registry,ref=ghcr.io/${REPO_LOWER}/nemo-skills-sandbox-image:cache \
          --cache-to type=registry,ref=ghcr.io/${REPO_LOWER}/nemo-skills-sandbox-image:cache,mode=max \
          --load \
          .
    - name: Run all tests
      env:
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        docker run --rm --network=host nemo-skills-sandbox-image &
        sleep 10
        set -o pipefail # this will make sure next line returns non-0 exit code if tests fail
        ns prepare_data gsm8k math-500
        python -m pytest tests/ -m "not gpu" --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=nemo_skills --cov=pipeline --durations=30 -rs -s -vvv
