# Multi-Node Multi-GPU SFT Validation
#
# Tests NeMo-Skills library imports, cross-node NCCL communication,
# and DDP training using Indexed Job + Headless Service pattern
# (same pattern as KubernetesBackend._build_job_manifest with num_nodes > 1).
#
# Usage:
#   kubectl apply -f scripts/k8s-tests/manifests/multi-node-sft-test.yaml
#   kubectl wait --for=condition=complete --timeout=900s job/sft-multi-node -n default
#   kubectl logs -l job-name=sft-multi-node -n default
#   kubectl delete -f scripts/k8s-tests/manifests/multi-node-sft-test.yaml
#
# Prerequisites:
#   - nemo-skills/nemo-rl:latest image loaded in containerd on at least 2 GPU nodes
#   - Both nodes must have the same number of nvidia.com/gpu available
#
# Pass signal: "MULTI-NODE PASSED" in rank-0 logs
#
# K8s patterns used (mirrors KubernetesBackend):
#   - Headless Service: _build_headless_service() — DNS-based pod discovery
#   - Indexed Job: _build_job_manifest(num_nodes=2) — completionMode: Indexed
#   - NODE_RANK from JOB_COMPLETION_INDEX: _inject_distributed_env_vars()
#   - podAntiAffinity: _build_pod_anti_affinity() — one pod per node
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: sft-multi-node-script
  namespace: default
data:
  train.py: |
    import os, sys

    # --- NeMo-Skills imports ---
    import nemo_skills
    print(f"nemo_skills {nemo_skills.__version__}")
    from nemo_skills.pipeline.backends.kubernetes import KubernetesBackend
    print("KubernetesBackend: OK")

    # --- Distributed setup ---
    import torch, torch.distributed as dist, torch.nn as nn
    from torch.nn.parallel import DistributedDataParallel as DDP
    dist.init_process_group(backend="nccl")
    rank, local_rank = dist.get_rank(), int(os.environ.get("LOCAL_RANK", 0))
    world_size = dist.get_world_size()
    node_rank = int(os.environ.get("NODE_RANK", os.environ.get("GROUP_RANK", 0)))
    device = torch.device(f"cuda:{local_rank}")
    torch.cuda.set_device(device)
    print(f"[Rank {rank}/{world_size}] Node {node_rank} GPU {local_rank}: {torch.cuda.get_device_name(device)}")

    # --- DDP training ---
    model = DDP(nn.Linear(64, 64).to(device), device_ids=[local_rank])
    for _ in range(10):
        loss = model(torch.randn(16, 64, device=device)).sum()
        loss.backward(); model.zero_grad()

    # --- Cross-node all-reduce verification ---
    t = torch.ones(1, device=device) * rank
    dist.all_reduce(t)
    expected = sum(range(world_size))
    assert abs(t.item() - expected) < 1e-4, f"all-reduce failed: {t.item()} != {expected}"

    dist.barrier()
    if rank == 0:
        import math
        print(f"MULTI-NODE PASSED: world_size={world_size} nodes={world_size//torch.cuda.device_count()} all_reduce={t.item()} loss={loss.item():.4f} NaN={math.isnan(loss.item())}")
    dist.destroy_process_group()
---
# Headless Service for DNS-based pod discovery
# Mirrors: KubernetesBackend._build_headless_service()
apiVersion: v1
kind: Service
metadata:
  name: sft-multi-node-workers
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: sft-multi-node
---
# Indexed Job for multi-node distributed training
# Mirrors: KubernetesBackend._build_job_manifest(num_nodes=2)
apiVersion: batch/v1
kind: Job
metadata:
  name: sft-multi-node
  namespace: default
  labels:
    app: nemo-skills
    test: sft-e2e-multi-node
spec:
  completionMode: Indexed    # Each pod gets JOB_COMPLETION_INDEX (0, 1, ...)
  completions: 2              # Number of nodes
  parallelism: 2              # All pods run simultaneously
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        job-name: sft-multi-node
    spec:
      restartPolicy: Never
      subdomain: sft-multi-node-workers   # Enables DNS: <pod>.<subdomain>.<ns>.svc.cluster.local
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: trainer
        image: nemo-skills/nemo-rl:latest
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        # MASTER_ADDR: DNS name of the rank-0 pod via the headless service
        # Mirrors: KubernetesBackend._inject_distributed_env_vars()
        - name: MASTER_ADDR
          value: "sft-multi-node-0.sft-multi-node-workers.default.svc.cluster.local"
        - name: MASTER_PORT
          value: "29500"
        - name: NCCL_DEBUG
          value: "INFO"
        command:
        - bash
        - -c
        - |
          # NODE_RANK from JOB_COMPLETION_INDEX — same as _inject_distributed_env_vars()
          export NODE_RANK=${JOB_COMPLETION_INDEX}
          echo "Node ${NODE_RANK}: waiting for master DNS..."
          for i in $(seq 1 60); do
            getent hosts sft-multi-node-0.sft-multi-node-workers.default.svc.cluster.local && break
            echo "  retry $i..."
            sleep 2
          done
          if ! getent hosts sft-multi-node-0.sft-multi-node-workers.default.svc.cluster.local > /dev/null 2>&1; then
            echo "FAIL: could not resolve master host sft-multi-node-0.sft-multi-node-workers.default.svc.cluster.local after 120s"
            exit 1
          fi
          torchrun --nproc_per_node=2 --nnodes=2 \
            --node_rank=${NODE_RANK} --master_addr=${MASTER_ADDR} \
            --master_port=29500 /scripts/train.py
        resources:
          limits: {nvidia.com/gpu: "2"}
          requests: {nvidia.com/gpu: "2", memory: "32Gi", cpu: "8"}
        volumeMounts:
        - {name: script, mountPath: /scripts}
        - {name: tmp, mountPath: /tmp}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        # Force one pod per node — mirrors _build_pod_anti_affinity()
        # NOTE: If your cluster has heterogeneous GPU counts across nodes,
        # add a nodeAffinity to restrict to nodes with matching GPU counts.
        # See docs/kubernetes-sft-runbook.md for examples.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                job-name: sft-multi-node
            topologyKey: kubernetes.io/hostname
      volumes:
      - name: script
        configMap: {name: sft-multi-node-script}
      - name: tmp
        emptyDir: {}
