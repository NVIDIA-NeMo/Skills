# Streaming variant of aceproof-tts-gems-remarkable-ultra-nvfp4-full200.yaml.
#
# Instead of the blocking SLURM DAG (prepare -> proof_gen -> aggregate ->
# verify -> ... -> finalize), a single per-problem streaming driver hits a
# persistent multiplexer fleet (one OpenAI gateway, two profiles) and advances
# each sample gen -> verify -> score independently, with early-stop verification
# and per-problem solved-and-stop feeding R2 refinement.
#
# Prereqs:
#   - multiplexer fleet up (nmux up) with profiles aceproof-ultra-nvfp4-proofgen
#     and aceproof-ultra-nvfp4-verify scaled on aws-cmh.
#   - NeMo-Skills on georgea/openai-usage-and-cache-key; NEMO_SKILLS_OPENAI_AIOHTTP=1.
# Launch:
#   python recipes/aceproof-tts/pipeline/run_streaming.py \
#     --config recipes/aceproof-tts/configs/aceproof-tts-gems-remarkable-ultra-nvfp4-streaming.yaml

pipeline:
  # the driver runs locally (cluster: none) -- the fleet handles remote SLURM.
  cluster: none
  output_dir: /scratch/fsw/portfolios/nemotron/users/imoshkov/aceproof-tts/ultra-nvfp4-550b-a55b/gems-remarkable-full200-cmh-streaming-r1r2-es8
  input_paths: /scratch/fsw/portfolios/nemotron/users/imoshkov/aceproof-tts/inputs/gems-remarkable.jsonl
  gateway_address: http://127.0.0.1:8000/v1
  # if cluster != none, the driver is submitted as a single CPU job:
  partition: cpu
  qos: null
  rerun_done: false

scaling:
  n_parallel_proof_gen: 128
  n_verification_per_proof: 64
  n_agg_trials: 32
  n_best_proofs_to_sample: 32
  n_proofs_to_refine: 1
  max_rating_per_score: 4
  solved_threshold: 0.99999
  max_rounds: 2
  # number of driver processes to shard problems across (1 = single driver)
  num_chunks: 1

# early-stop experiment knobs (the variable under test vs the blocking baseline)
streaming:
  min_verifications_per_proof: 8
  early_stop_only_if_score_lt_1: true
  cancel_remaining: true
  # global in-flight request bound for the driver (problem-level priming)
  max_concurrent_requests: 4096
  # Per-role in-flight lanes (prevents the gen backlog from starving verify via
  # one shared FIFO semaphore). Sized to the autoscaled fleet: proofgen 48x8=384
  # slots, verify up to 80x64=5120 slots (verify is the heavy stage we autoscale
  # to 256 extra GPUs). The lane must be >= server slots or the driver, not the
  # fleet, becomes the verify ceiling.
  gen_max_concurrent: 512
  verify_max_concurrent: 5120
  refine_max_concurrent: 512

inference:
  temperature: 1.0
  top_p: 0.95
  timeout: 14400
  gen_tokens_to_generate: 500000
  verify_tokens_to_generate: 200000
  refine_tokens_to_generate: 480000

# multiplexer profile names (the OpenAI `model` selects the fleet)
profiles:
  proof_gen: aceproof-ultra-nvfp4-proofgen
  verify: aceproof-ultra-nvfp4-verify
  refine: aceproof-ultra-nvfp4-proofgen
