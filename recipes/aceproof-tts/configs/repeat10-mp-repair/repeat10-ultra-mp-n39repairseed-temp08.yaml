  max_rounds: 1
  num_chunks: 1

streaming:
  min_verifications_per_proof: 4
  early_stop_only_if_score_lt_1: true
  cancel_remaining: true
  max_concurrent_requests: 512
  gen_max_concurrent: 64
  verify_max_concurrent: 256
  refine_max_concurrent: 64

inference:
  temperature: 0.8
  top_p: 0.95
  timeout: 14400
  gen_temperature: 0.8
  verify_temperature: 1.0
  refine_temperature: 0.8

profiles:
  proof_gen: ultra
  verify: ultra
  refine: ultra
