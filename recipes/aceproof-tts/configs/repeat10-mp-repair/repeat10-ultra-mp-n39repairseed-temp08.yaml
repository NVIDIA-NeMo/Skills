# Targeted N39_51 repair-seed run against the cloud multiplexer.
# Token budgets are intentionally omitted so the 256k endpoint default applies.

pipeline:
  cluster: none
  output_dir: /home/igitman/workspace/NeMo-Skills-aceproof-mp/outputs/repeat10-ultra-mp-n39repairseed/temp08/repairseed
  input_paths: recipes/aceproof-tts/dataset/repeat10-n39-51-repairseed-20260610.jsonl
  gateway_address: http://aiapps-053026.dyn.nvidia.com:28000/v1
  proof_gen_prompt_path: recipes/aceproof-tts/prompts/proof_generation_repair_seed.yaml
  verify_prompt_path: recipes/aceproof-tts/prompts/proof_verification.yaml
  refine_prompt_path: recipes/aceproof-tts/prompts/proof_refinement.yaml
  partition: null
  qos: null
  rerun_done: false

scaling:
  n_parallel_proof_gen: 64
  n_verification_per_proof: 16
  n_agg_trials: 8
  n_best_proofs_to_sample: 12
  n_proofs_to_refine: 2
  max_rating_per_score: 4
