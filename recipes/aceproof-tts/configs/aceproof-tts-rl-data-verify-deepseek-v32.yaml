pipeline:
  cluster: slurm
  output_dir: /scratch/fsw/portfolios/llmservice/users/yachen/AceMath/Skills/aceproof-tts/math-sft-v2/rl_data
  partition: batch
  cpu_partition: cpu
  data_job_gpus: 1
