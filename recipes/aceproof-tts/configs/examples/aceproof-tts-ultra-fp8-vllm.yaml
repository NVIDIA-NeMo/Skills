# Old FP8/SFT-16000 vLLM server arguments.
model_profile: ultra_fp8
model_profiles:
  ultra_fp8:
    model: ${MODEL}
    server_type: vllm
    server_gpus: 4
    server_nodes: 4
    server_container: ${CONTAINER}
    server_args: >-
      --trust-remote-code
      --load-format auto
      --tensor-parallel-size 4
      --data-parallel-size 4
      --data-parallel-backend ray
      --data-parallel-address $(getent hosts $SLURM_MASTER_NODE | awk '{print $1}')
      --data-parallel-size-local 1
      --distributed-executor-backend ray
      --enable-expert-parallel
      --kv-cache-dtype auto
      --gpu-memory-utilization 0.85
      --max-num-seqs 256
      --max-cudagraph-capture-size 256
      --max-num-batched-tokens 8480
      --max-model-len 262144
      --mamba-cache-mode align
      --enable-prefix-caching
      --enable-chunked-prefill
      --reasoning-parser-plugin ${PLUGIN}
      --reasoning-parser ultra_v3
      --model-loader-extra-config '{\"enable_multithread_load\":true,\"num_threads\":96}'
